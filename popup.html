<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Model Grabber for Tripo3D</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20">
      <h1>Model Grabber</h1>
    </div>
    <div class="actions">
      <button id="downloadAll" title="Downloads everything not already marked as downloaded">Download New</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <div id="list"></div>
  <p id="empty" class="empty">No model files detected yet. Browse studio.tripo3d.ai, open or generate a model — this list fills in automatically as .glb/.gltf/.fbx/.obj/.usdz/.stl files load.</p>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <footer>Unofficial tool · not affiliated with or endorsed by Tripo3D</footer>
  <script src="popup.js"></script>
</body>
</html>
